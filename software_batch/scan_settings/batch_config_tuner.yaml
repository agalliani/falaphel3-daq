serial:
  port: "COM3"
  baud: 115200

injection:
  bypass: 0
  period: 63
  burst: 1
  duty: 8

tasks:
  - name: TEST_SUBMATRIX_SCAN
    operation: submatrix_scan
    submatrix:
      start_x: 3 # Starting X coordinate of the sub-matrix (to be within 0-31)
      start_y: 3 # Starting Y coordinate of the sub-matrix (to be within 0-7)
      width:  4 # Span Width of the sub-matrix (max 32). Considera che 32 è il massimo. quindi potrai al massimo fare 32 - start_x
      height: 4 # Span Height of the sub-matrix (max 8). Considera che 8 è il massimo. quindi potrai al massimo fare 8 - start_y
    sweep:
      start_v: 70
      end_v: 45
      step_v: 3
      num_injections: 10
      pixel_x: 0
      pixel_y: 0
      long_sweep_tot: false
    config:
      dac_th: 0
      cap25: 0
      cap50: 1
      test_en: 1
      cap_csa_load: 1
      t_up: 0
      out_en: 1
      x: 0
      y: 0
    tuner:
      enabled: true
      file: tuner_configs/tdac_tuning_results.tsv
    