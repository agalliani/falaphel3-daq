serial:
  port: "COM3"
  baud: 115200

injection:
  bypass: 0
  period: 63
  burst: 1
  duty: 8

tasks:

  - name: TEST_TOT_SCAN
    operation: matrix_scan
    sweep:
      start_v: 80
      end_v: 45
      step_v: 3
      num_injections: 10
      pixel_x: 0
      pixel_y: 0
      long_sweep_tot: true
      long_sweep_range:
        start_long_v: 460
        end_long_v: 100
        step_long_v: 40
    config:
      dac_th: 0
      cap25: 0
      cap50: 0
      test_en: 1
      cap_csa_load: 1
      t_up: 0
      out_en: 1
      x: 0
      y: 0
    tuner:
      enabled: true
      file: tuner_configs/tdac_tuning_results.tsv
    